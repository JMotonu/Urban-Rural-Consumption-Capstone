[project]
name = "pydatacapstone"
version = "0.1.0"
description = "Kenya Urban_Rural Consumption Project"
readme = "README.md"
authors = [
    { name = "JMotonu", email = "mtnjosephat@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "pyreadstat>=1.3.6",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
    "statsmodels>=0.15.0",
    "streamlit>=1.65.0",
]

[project.scripts]
pydatacapstone = "pydatacapstone:main"

[build-system]
requires = ["uv_build>=0.12.12,<0.13.0"]
build-backend = "uv_build"
